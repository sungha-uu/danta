[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "danta"
version = "0.1.0"
description = "KIS paper-trading research and controlled short-term trading automation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.136,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
danta = "danta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/danta"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["danta"]

